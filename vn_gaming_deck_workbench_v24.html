  <script>
    const STORAGE_KEY="vn-gaming-deck-workbench-v25",FIELDS=["slide_number", "slide_type", "part_number", "part_name", "section", "subsection", "category", "title", "purpose", "evidence", "visual", "takeaway", "status", "owner", "notes"],SEED="slide_number,slide_type,part_number,part_name,section,subsection,category,title,purpose,evidence,visual,takeaway,status,owner,notes\n1,cover,,,,,meta,Examining Vietnam Gaming Market Opportunity 2026,Open the deck with the market question and geographic focus.,Deck title and brand framing only.,Bold title slide with Garena-style red accent and Vietnam label.,This deck tests whether Vietnam is a near-term sourcing opportunity in 2026.,seed,,Use as the entry slide for HTML and PowerPoint.\n2,divider,01,Executive Summary,Executive Summary,,meta,Executive Summary,Start the summary section.,,Centered section-break title.,\"Lead with the answer, then let the body prove it.\",seed,,\n3,divider,02,Macro & Cultural Factors,Macro & Cultural Factors,,meta,Macro & Cultural Factors,Start the readiness-factor section.,,Section break with subtitle for demand-side and supply-side drivers.,Establish whether Vietnam is becoming more ready for local game success.,seed,,\n4,content,02,Macro & Cultural Factors,Demand-side Factors,Income per Capita,demand,Income per Capita Trends & Regional Benchmarking,\"Show whether rising purchasing power is improving Vietnam's readiness for higher-value gaming spend, using actual World Bank GDP per capita data through 2024.\",\"World Bank GDP per capita (current US$), Viet Nam:\\n- 2015: $2,578\\n- 2016: $2,735\\n- 2017: $2,956\\n- 2018: $3,222\\n- 2019: $3,441\\n- 2020: $3,534\\n- 2021: $3,704\\n- 2022: $4,148\\n- 2023: $4,323\\n- 2024: $4,717\\n\\n2015-2024 CAGR:\\n- Viet Nam: 6.95%\\n- Indonesia: 4.59%\\n- Philippines: 3.55%\\n- Thailand: 2.88%\\n- Malaysia: 2.33%\",\"Custom benchmark slide: 2015-2024 Vietnam trend bars on the left, KPI cards plus ASEAN benchmark CAGR bars on the right.\",\"Vietnam still trails richer ASEAN peers on absolute income, but its faster GDP-per-capita growth supports stronger medium-term upside for discretionary gaming spend.\",priority,,Source: World Bank.\n5,content,02,Macro & Cultural Factors,Demand-side Factors,Demand for Digital Entertainment,demand,Demand for Digital Entertainment,\"Use official sector-value data to infer long-run demand growth for digital entertainment in Vietnam, on a 2015-2024 window consistent with slide 8.\",\"National Statistics Office of Vietnam sector-value series, 2015-2024:\\n- Information & Communication (VND bn): 29,392 to 387,489\\n- Arts & Entertainment (VND bn): 24,969 to 71,488\\n\\n2015-2024 CAGR:\\n- Information & Communication: 33.18%\\n- Arts & Entertainment: 12.40%\",\"Line chart with 2 lines: Information & Communication and Arts & Entertainment, plus two CAGR scorecards.\",\"The steady uptrend in demand for Information & Communication and Arts & Entertainment services probably implies a steady rise in demand for digital entertainment, including games.\",priority,,Source: National Statistics Office of Vietnam.\n6,content,02,Macro & Cultural Factors,Demand-side Factors,Demographics,demand,Demographics of Vietnamese Gamers,Use actual game-level demographics to show which age cohorts dominate the highest-grossing mobile games in Vietnam.,\"Top 10 grossing games in Vietnam by 2025 revenue from the local warehouse, with age-bucket distributions pulled from Sensor Tower demographics and combined across app variants using average 2025 VN DAU as weights.\\n\\nImportant method note:\\n- Revenue ranking is Vietnam-only\\n- Demographics use Sensor Tower's SE_ASIA geography because VN is not supported directly by that endpoint\\n- App-level demographic mixes are combined using avg DAU in Vietnam during 2025\\n- Sensor Tower bucket labels are rendered here as age bands: 0-17, 18-24, 25-34, 35-44, 45-54\",\"Stacked horizontal bar chart by game using age bands 0-17, 18-24, 25-34, 35-44, and 45-54, plus a short portfolio read-through.\",\"Mobile gamers of biggest games in Vietnam are mostly made up of those who are under 25 years old, with the age group of 18-24 contributing the most players.\",priority,,Source: SensorTower (Revenue-adjusted for Vietnam market; Demographics of SE_ASIA is used as proxy for VN and app variants are combined using average 2025 VN DAU weights).\n7,content,02,Macro & Cultural Factors,Demand-side Factors,Historical Demographic Changes,demand,Vietnam Overall Demographics,Recreate Vietnam's changing population pyramid from 1950 to 2025 so we can visually explain how the country's age structure evolved into today's gaming-relevant demographic base.,\"Annual Vietnam age-by-sex population pyramid data for 1950-2025, including total population and median age. Local recreation based on PopulationPyramids.org and UN World Population Prospects 2024.\",\"Interactive animated population pyramid with play controls, year slider, and quick-jump buttons.\",\"Vietnam has a large under-25 population of 37.2 million, equal to 36.6% of the population, which serves as a major potential target audience for gaming.\",priority,,Source: PopulationPyramids.org / UN World Population Prospects 2024.\n8,content,02,Macro & Cultural Factors,Demand-side Factors,Under-25 Population Trend,demand,\"Under-25 Population Trend, 1980-2025\",Show how Vietnam's under-25 audience base has evolved over time in both absolute size and share of population.,\"Vietnam under-25 population (0-24) from 1980 to 2025, using the same local population-pyramid dataset as slide 11. Bar = number of people. Line = under-25 share of total population.\",\"Combo chart with bars for under-25 people and line for under-25 percentage share, 1980-2025.\",\"With a rapidly aging population and low replacement rate, Vietnam's under-25 population has already been in a downtrend. If this trend continues, games with mostly youthful user bases will eventually face active-user pressure.\",priority,,Source: PopulationPyramids.org / UN World Population Prospects 2024.\n9,content,02,Macro & Cultural Factors,Demand-side Factors,Hardware,demand,Hardware,\"Show that device access and connectivity are already strong enough to support mass mobile play, meaningful PC play, and limited console play.\",Hardware and connectivity evidence:\\n- 100.7M smartphone subscribers in Feb 2024\\n- 127.6 mobile cellular subscriptions per 100 people in 2024\\n- 84.15% internet users in 2024\\n- 99% 4G population coverage in Nov 2024\\n- 90% 5G population coverage by Feb 2026\\n- 82.3% of households on fiber in Oct 2024\\n- 68% of urban 18-39 respondents owned a desktop or laptop in a 2017 Q&Me survey\\n- Console penetration remains below 5%,Custom hardware-readiness slide with mobile access metrics on the left and PC / console context on the right.,\"Vietnam is already a mobile-first hardware market: smartphone and internet access are effectively mass-market, urban PC ownership is still meaningful, and console remains niche.\",priority,,\"Sources: Freedom House, World Bank/TradingEconomics, Vietnam+, VietnamNet, VnExpress, Pew Research, Q&Me, Digital in Asia.\"\n10,content,02,Macro & Cultural Factors,Demand-side Factors,Console Button Era,demand,Vietnam Gaming History: Console Button Era,\"Show how gaming first took root in Vietnam through rented consoles, arcade corners, and neighborhood spectators before any formal industry existed.\",\"Era focus:\r\n- 1990s\r\n- Famicom / NES clones and PS1 as luxury devices\r\n- Cartridge console shops and arcade centers\r\n- Hyper-local, face-to-face gaming culture\",\"Large placeholder collage on the left, structured era panel on the right, and static four-era tabs on top.\",\"Gaming in Vietnam began as a local, face-to-face pastime built around rented consoles and shared neighborhood play.\",priority,,Source: The Evolution of Gaming in Vietnam research document.\n11,content,02,Macro & Cultural Factors,Demand-side Factors,PC Gaming & Internet Boom,demand,Vietnam Gaming History: PC Gaming & Internet Boom,\"Show how ADSL, Quan Net culture, and the first publishers turned gaming into a mass youth habit while also triggering the strongest social backlash.\",\"Era focus:\r\n- 2000-2010\r\n- ADSL rollout and Quan Net dominance\r\n- VNG, VTC Game, FPT Online\r\n- LAN classics and first online-game boom\",\"Large placeholder collage on the left, structured era panel on the right, and static four-era tabs on top.\",\"The internet era made gaming mass-market in Vietnam, but it also produced the country's strongest stigma around games.\",priority,,Source: The Evolution of Gaming in Vietnam research document.\n12,content,02,Macro & Cultural Factors,Demand-side Factors,Mobile Shift & Dawn of Esports,demand,Vietnam Gaming History: Mobile Shift & Esports,\"Show how smartphones, free-to-play games, streaming, and esports made gaming more mainstream and commercially visible.\",\"Era focus:\r\n- 2011-2020\r\n- 3G/4G and affordable smartphones\r\n- Flappy Bird global shockwave\r\n- Garena, streaming, and esports professionalization\",\"Large placeholder collage on the left, structured era panel on the right, and static four-era tabs on top.\",Mobile and esports turned gaming into everyday entertainment and a more socially accepted career path.,priority,,Source: The Evolution of Gaming in Vietnam research document.\n13,content,02,Macro & Cultural Factors,Demand-side Factors,Cross-Platform & Digital Economy Era,demand,Vietnam Gaming History: Digital Economy Era,\"Show how gaming moved into a cross-platform, globalized, creative-tech role inside Vietnam's digital economy.\",\"Era focus:\r\n- 2021-present\r\n- 5G, cloud, and advanced engines\r\n- Amanotes, iKame, Sky Mavis / Axie Infinity\r\n- GameVerse, university game majors, and ecosystem recognition\r\n- 2024: >2,000 bn VND from international users on Google Play (apps + games)\r\n- 2025: 4.9B global downloads for Vietnamese-made mobile games\",\"Large placeholder collage on the left, structured era panel on the right, and static four-era tabs on top.\",\"Gaming is now framed as a cross-platform creative-tech industry, with Vietnamese studios producing for the world at real export scale.\",priority,,Source: The Evolution of Gaming in Vietnam research document; ABEI; Google App Summit 2025; VnExpress GameVerse 2026.\n14,content,02,Macro & Cultural Factors,Demand-side Factors,History Summary,demand,Vietnam Gaming History: Summary,\"Summarize how gaming evolved across all four eras in culture, acceptance, and domestic production capability.\",Columns:\\n- Aspect\\n- Console Button 1990s\\n- PC & Internet Boom 2000-2010\\n- Mobile Shift & Esports 2011-2020\\n- Digital Economy Era 2021-Present\\n\\nRows:\\n- Gaming Culture\\n- Social Acceptance\\n- VN Game Production,Five-column comparison table with compact era summaries by aspect.,\"Vietnam's gaming history moved from local play culture into mass digital entertainment, then into a more visible production and export ecosystem.\",priority,,Source: The Evolution of Gaming in Vietnam research document.\n15,content,02,Macro & Cultural Factors,Demand-side Factors,Macro Transformation Bedrock,demand,Vietnam Macro Backdrop,Zoom out from gaming history to the broader macro shifts that explain why Vietnam's gaming market could evolve so sharply across eras.,Foundational factors from the Bedrock slide:\\n- Economic Condition\\n- State of Technology\\n- Human Resource Capability\\n- Global Cultural Integration\\n- Consumerism & Payment\\n\\nTime columns:\\n- 1990s: Post-Doi Moi & Analog\\n- 2000s: Industrializing & Broadband\\n- 2010s: Mobile Leapfrog & Startup Boom\\n- 2021-2026: Digital Economy & Global Export,Four-era macro matrix showing how Vietnam evolved beneath the gaming market.,\"Gaming shifted because the country itself shifted: income rose, technology spread, skills deepened, culture globalized, and digital spending became normal.\",priority,,\"Source: Vietnam_Macro_Transformation_Bedrock.pptx, slide 3.\"\n16,content,02,Macro & Cultural Factors,Demand-side Factors,Made-in-Vietnam Entertainment: Movies,demand,THE RISE OF MADE-IN-VIETNAM ENTERTAINMENT: MOVIES,\"Use Vietnam cinema output and box-office data to show that domestic entertainment production has expanded meaningfully over time, even while international films still dominate total releases.\",\"Movie counts use unique movie_slug by listing_year from the merged Moveek + Box Office Vietnam sheet, split between Vietnamese and non-Vietnamese titles. Top-grossing Vietnamese movies use boxofficevietnam_total_revenue_vnd where available.\\n\\nDirectional local counts:\\n- 2010: 4 Vietnamese vs 18 non-Vietnamese\\n- 2015: 40 vs 187\\n- 2020: 22 vs 168\\n- 2025: 46 vs 232\",\"Left: stacked yearly chart of Vietnamese and non-Vietnamese movie slugs. Right: top-grossing Vietnamese movie table with release year, title, and revenue.\",\"While international movies still take up the majority, the number of Vietnamese movies going to the cinema has trended upward over time, and we increasingly see more high-grossing local releases.\",priority,,Source: Moveek + Box Office Vietnam merged cinema dataset.\n17,content,02,Macro & Cultural Factors,Demand-side Factors,Made-in-Vietnam Entertainment: Movies,demand,THE RISE OF MADE-IN-VIETNAM ENTERTAINMENT: MOVIES,Use estimated Box Office Vietnam revenue together with a top-movie comparison table to show that Vietnamese movies are competing fiercely with foreign movies for box-office dominance from 2021 to 2025.,\"Estimated yearly revenue from Box Office Vietnam and web research, deduped by movie_slug within each listing year and skipping rows without revenue.\\n\\nThis duplicate slide keeps the same revenue context but presents the right-side movie comparison table in a more balanced centered layout.\",\"Left: stacked revenue columns with Vietnamese and foreign movie revenue by year, plus a line chart of Vietnamese share (%). Right: centered year-by-year comparison table of top grossing Vietnamese and foreign movies.\",\"According to estimated revenue data from Box Office Vietnam and web research, made-in-Vietnam movies have been competing quite fiercely with foreign movies for market dominance. The most recent number shows Vietnamese movies accounting for 59% of box office revenue in Vietnam in 2025, and given the recent record-breaking Vietnamese movies, it seems that Vietnamese movies are gaining ground.\",priority,,Source: Moveek + Box Office Vietnam merged cinema dataset; revenue estimated from Box Office Vietnam and web research.\n18,content,02,Macro & Cultural Factors,Demand-side Factors,Made-in-Vietnam Entertainment: Concerts,demand,THE RISE OF MADE-IN-VIETNAM ENTERTAINMENT: CONCERTS,Use concert listing data to show that Vietnamese live entertainment is no longer just importing attention from foreign acts; locally produced concerts are now scaling into recognizable mass events.,\"Vietnamese vs non-Vietnamese concert counts come from the concertarchives.org sheet, using the is_vietnamese_concert flag.\\n\\nDirectional counts used for the slide:\\n- 2010: 0 Vietnamese vs 5 non-Vietnamese\\n- 2015: 0 vs 20\\n- 2020: 5 vs 9\\n- 2025: 48 vs 35\\n\\n2026 is excluded as partial/in-progress coverage.\",Left: stacked bar chart of Vietnamese and non-Vietnamese concert counts by year. Right: hero image of Anh Trai Say Hi as an iconic local-concert example.,\"International acts still make up much of the concert market historically, but Vietnamese concerts have risen sharply and now produce their own iconic large-scale live events.\",priority,,Source: concertarchives.org sheet; image via Vie Channel / VnExpress.\n19,content,02,Macro & Cultural Factors,Demand-side Factors,Made-in-Vietnam Entertainment: Ticketbox,demand,THE RISE OF MADE-IN-VIETNAM ENTERTAINMENT: TICKETBOX,Use Ticketbox sold-out tiers to show how much broader domestic entertainment demand has become than foreign entertainment demand inside Vietnam.,\"Entertainment-only Ticketbox tiers are split by the event-level foreign_event flag after excluding non-entertainment categories. Each sold-out ticket tier is treated as a product.\\n\\nYearly sold-out ticket tier counts:\\n- 2023: Vietnam 408 vs Foreign 32\\n- 2024: Vietnam 508 vs Foreign 106\\n- 2025: Vietnam 1,437 vs Foreign 222\\n\\nKept categories:\\n- music\\n- theatersandart\\n- others\\n- sport\",\"Grouped column chart with Vietnam and foreign sold-out ticket-tier counts side by side for each year, plus concise market-read and source notes.\",\"Data from Ticketbox, the most popular e-commerce platform in Vietnam for event tickets, also highlights the dominance of domestic events' sold-out ticket tiers versus foreign. In 2025, 86.6% of all sold-out ticket tiers on Ticketbox are Vietnamese domestic events.\",priority,,\"Source: Ticketbox event-level source joined to entertainment-only Vietnam/foreign sold-out tier summaries; categories kept: music, theatersandart, others, sport.\"\n20,content,02,Macro & Cultural Factors,Demand-side Factors,Ticketbox Pricing Power,demand,Ticketbox: A Glimpse into Vietnamese Willingness to Pay for Entertainment Events,Show the foreign-event side of Ticketbox pricing by comparing ticket tier count and sold-out rate across price buckets for 2023-2025.,\"Use these two foreign-event tables:\\n- ticketbox_foreign_events_entertainment_only_yearly_price_bucket_ticket_tier_count_2023_2025_wide\\n- ticketbox_foreign_events_entertainment_only_yearly_price_bucket_soldout_rate_2023_2025_wide\\n\\nScope:\\n- Categories limited to music, theatersandart, others, sport\\n- Years: 2023-2025\",\"Single-origin table slide focused on foreign events, with one ticket tier count table and one sold-out rate table.\",\"For foreign events, the price bucket with the highest supply of ticket tiers is 1M-5M. This is also the bucket with the second-highest sold-out rate at 49.29%. The bucket with the highest sold-out rate is 5M-10M at 60.32%.\",priority,,\"Source: Ticketbox tier rows joined to the foreign_event event sheet; entertainment-only categories: music, theatersandart, others, sport.\"\n21,content,02,Macro & Cultural Factors,Demand-side Factors,Ticketbox Pricing Power,demand,Ticketbox: A Glimpse into Vietnamese Willingness to Pay for Entertainment Events,Show the Vietnamese-event side of Ticketbox pricing by comparing ticket tier count and sold-out rate across price buckets for 2023-2025.,\"Use these two Vietnamese-event tables:\\n- ticketbox_vietnam_events_entertainment_only_yearly_price_bucket_ticket_tier_count_2023_2025_wide\\n- ticketbox_vietnam_events_entertainment_only_yearly_price_bucket_soldout_rate_2023_2025_wide\\n\\nScope:\\n- Categories limited to music, theatersandart, others, sport\\n- Years: 2023-2025\",\"Single-origin table slide focused on Vietnamese events, with one ticket tier count table and one sold-out rate table.\",\"For Vietnamese events, the offer is more diverse, with 3 buckets dominating ticket tier supply: 100k-500k, 500k-1M, and 1M-5M. Sold-out rate is tilted toward more premium price buckets, with the >20M bucket actually commanding the highest sold-out rate at 66.67%. This shows that Vietnamese are not only willing to attend more Vietnamese events but are also willing to pay high prices for premium ticket tiers of prominent events.\",priority,,\"Source: Ticketbox tier rows joined to the foreign_event event sheet; entertainment-only categories: music, theatersandart, others, sport.\"\n22,content,02,Macro & Cultural Factors,Demand-side Factors,Made-in-Vietnam Entertainment: YouTube Videos,demand,THE RISE OF MADE-IN-VIETNAM ENTERTAINMENT: YOUTUBE VIDEOS?,\"Use daily YouTube trending-language data to show whether Vietnamese-language content still dominates attention on a global platform, then ground it with one concrete day-level trending snapshot.\",\"Daily Vietnamese-video share uses the language-count sheet from 2022-07-01 to 2025-06-30. The right-side table uses unique trending videos captured on 2025-06-30 from the per-video sheet, deduplicated by video_id within the day.\\n\\nKey stats:\\n- Average daily Vietnamese share: 70.79%\\n- 2025-06-30 Vietnamese share: 61.02%\\n- Unique trending videos on 2025-06-30: 59\",Left: dense daily line chart of Vietnamese-video share in YouTube trending. Right: scrollable unique trending videos table for 2025-06-30.,\"While Vietnamese videos still make up the majority of YouTube trending in Vietnam, there is a gradual decline over time, showing that Vietnamese audiences are increasingly watching more YouTube content from international creators.\",priority,,Source: most_popular_vn_daily_video_language_counts.csv and most_popular_vn_with_is_vietnamese_video.csv.\n23,content,02,Macro & Cultural Factors,Demand-side Factors,Demand Conclusion,demand,QUICK SUMMARY: VIETNAM GAMING DEMAND,\"Synthesize the market-readiness section into one demand conclusion: where growth has come from, what is supporting it now, and what may limit it later.\",\"This slide should compress the macro, demographic, and history signals into one demand narrative.\\n\\nInclude:\\n- 4 gaming-history eras\\n- Core demand drivers\\n- Near-term vs medium/long-term implication\",Top: 4-era progression strip. Bottom: horizontal factor cards for demand drivers.,\"Vietnam has seen a macro-backed gaming boom, but the same demographic transition that helped create today's market may slow growth later unless the industry broadens beyond the youngest cohorts.\",priority,,Conclusion slide bridging slides 8-23 into a demand view.\n24,content,02,Macro & Cultural Factors,Demand-side Factors,Domestic vs International Preference Conclusion,demand,QUICK SUMMARY: VIETNAM'S PREFERENCE - DOMESTIC VS INTERNATIONAL,\"Synthesize the movies, concerts, YouTube, and Ticketbox evidence into one conclusion about where Vietnamese audiences prefer domestic content and where international content is still gaining ground.\",This slide should compare high-investment local entertainment success versus everyday global-platform consumption.\\n\\nUse:\\n- Movies slide\\n- Concerts slide\\n- Ticketbox slide\\n- YouTube slide,\"Comparative summary across Movies, Concerts, Ticketbox, and YouTube with one conclusion on domestic-vs-international preference.\",\"Made-in-Vietnam entertainment is gaining ground in heavier, high-investment formats, but daily online entertainment shows a more mixed and increasingly international consumption pattern.\",priority,,Conclusion slide bridging slides 16-19 into a preference view.\n25,content,02,Macro & Cultural Factors,Supply-side Factors,Government Regulation & Policy,supply,SHIFTING GOVERNMENT STANCE & INDUSTRY REGULATION,\"Explain how Vietnam moved from suspicion and containment toward strategic promotion, while still imposing a tightly controlled domestic operating framework.\",Use only the government-support research doc. Include:\\n- Early defensive stance\\n- Shift to gaming as a cultural / digital industry\\n- Decree 147 as the new compliance-heavy regime\\n- Why this favors committed local operators over casual foreign entry,\"Custom policy slide with policy-shift summary, Decree 147 implications, and operator-impact boxes.\",\"Vietnam now treats gaming as a strategic digital-content industry, but it still regulates the market through a strict localization and compliance regime that raises the barrier to entry.\",priority,,Source: Vietnamese Game Development Government Support.docx\n26,content,02,Macro & Cultural Factors,Supply-side Factors,Support for Domestic Game Development,supply,SUPPORT FOR DOMESTIC GAME DEVELOPMENT: DIRECT & INDIRECT,\"Show how the Vietnamese state actively supports local game development through direct promotion, fiscal incentives, and talent-pipeline building.\",\"Use only the government-support research doc. Include:\\n- Resolutions 79/80 and cultural-industry framing\\n- GameVerse / GameHub / Vietnam Game Alliance\\n- CIT incentives, VAT exemption, R&D super-deduction, SME support\\n- PTIT, UIT, RMIT, FPT Polytechnic and talent pipeline\",\"Custom support slide with direct support, indirect support, and talent-pipeline sections.\",\"Beyond regulation, Vietnam is increasingly building an enabling stack for domestic studios: promotional platforms, tax incentives, and a more formal game-development talent pipeline.\",priority,,Source: Vietnamese Game Development Government Support.docx\n27,content,02,Macro & Cultural Factors,Supply-side Factors,Quality of Made in VN Games / Capability of VN Studios,supply,QUALITY OF MADE IN VN GAMES / CAPABILITY OF VN STUDIOS,Show how Vietnam's production capability evolved from outsourcing and localization into mobile publishing scale and credible premium PC / console development.,Use only the production-ecosystem research doc. Include:\\n- Glass Egg and Gameloft as capability academies\\n- Flappy Bird and mobile publishing scale\\n- Amanotes / ABI / Zitga / Sky Mavis / premium PC indies\\n- 2025 output scale and export orientation,\"Custom capability slide with evolution ladder, flagship studios, and ecosystem KPIs.\",\"Vietnamese studio capability is no longer just low-cost execution: the market now supports global mobile publishing at scale and an emerging layer of credible premium PC development, although output is still overwhelmingly export-oriented.\",priority,,Source: Vietnam Game Production Ecosystem_ Evolution.docx\n",EXPECTED_SLIDE_COUNT=27;

da V\\u00e0 Tro T\\u00e0n\",\"foreign_revenue_vnd\":285749882742.0}],\"totalVietnamese\":8749334476263.0,\"totalForeign\":10423973526864.0,\"latestVietnamese\":3671574487321.0,\"latestForeign\":2523506133904.0,\"latestShare\":59.265967818752806,\"peakYear\":2025,\"source\":\"moveek_vietnam_monthly_movies_with_boxofficevietnam_recovered_v5_and_vietnamese_flag_gpt54nano_20260528T044609Z.csv; revenue estimated from Box Office Vietnam and web research.\"},\"14\":{\"era_key\":\"console-button\",\"era_title\":\"Dawn of Gaming & Console Button Era\",\"years\":\"1990s\",\"summary\":\"Following Doi Moi, game devices entered Vietnam through informal trade channels. The market had no official publishers, and NES clones, Sega Mega Drive units, and later PS1 machines were still luxury items.\",\"visual_label\":\"Placeholder collage: 4-button electronics, cartridge console shops, arcade corners, PS1 rental counters\",\"visual_note\":\"Representative image for cartridge-console culture and neighborhood play.\",\"image_url\":\"images/era1.jpg\",\"image_credit\":\"Image: local file - era1.jpg\",\"milestones\":[\"Imported and hand-carried electronics seeded Vietnam's first game market in the 1990s.\",\"NES-style '4-button electronics' and later PS1 machines became iconic but still premium devices.\",\"Hourly rented cartridge-console shops and arcade centers became the first gaming venues.\"],\"culture\":\"Gaming was hyper-local and face-to-face. Spectators often outnumbered players, shouting advice and cheering while neighborhood kids waited for their turns. The slang term 'pha dao' came from this era.\",\"acceptance\":\"There was effectively no legal framework because the market was tiny and spontaneous. Parents mainly saw gaming as a childish waste of time linked to laziness and delinquency.\",\"source\":\"The Evolution of Gaming in Vietnam research document.\"},\"15\":{\"era_key\":\"pc-internet\",\"era_title\":\"Golden Age of PC Gaming & Internet Boom\",\"years\":\"2000 - 2010\",\"summary\":\"ADSL spread quickly from 2003 to 2004, enabling the first major local publishers such as Vinagame, VTC Game, and FPT Online. Vietnam shifted from offline play into the first large online-game boom.\",\"visual_label\":\"Placeholder collage: Quan Net rows, Counter-Strike, AoE, Vo Lam Truyen Ky, scratch cards\",\"visual_note\":\"Representative image for Quan Net culture, LAN classics, and the first online-game boom.\",\"image_url\":\"images/era2.webp\",\"image_credit\":\"Image: local file - era2.webp\",\"milestones\":[\"ADSL rollout and Quan Net expansion made PC gaming the dominant format.\",\"Counter-Strike, AoE, Warcraft III DotA, and online titles like Vo Lam Truyen Ky and MU defined the era.\",\"Scratch cards, 'cam chuot', guilds, and real-money item trading became everyday behavior.\"],\"culture\":\"Quan Net culture became a defining social phenomenon for the 8x and 9x generations. Virtual guilds spilled into nationwide offline meetups, and the in-game black market peaked.\",\"acceptance\":\"Government regulation tightened through curfews, playtime restrictions, and licensing. Social stigma also hit its peak, with mainstream media turning games into a scapegoat for addiction and academic failure.\",\"source\":\"The Evolution of Gaming in Vietnam research document.\"},\"16\":{\"era_key\":\"mobile-esports\",\"era_title\":\"Mobile Shift & the Dawn of Esports\",\"years\":\"2011 - 2020\",\"summary\":\"3G and 4G infrastructure, affordable smartphones, and Garena's free-to-play model reshaped the market. Flappy Bird then proved that a Vietnamese developer could create a game with global impact.\",\"visual_label\":\"Placeholder collage: smartphones, Flappy Bird, Lien Quan, Free Fire, streamers, esports stages\",\"visual_note\":\"Representative image for smartphone-led play, streaming culture, and the rise of esports.\",\"image_url\":\"images/era3.png\",\"image_credit\":\"Image: local file - era3.png\",\"milestones\":[\"Affordable smartphones and 3G/4G shifted gaming from cafes into daily mobile routines.\",\"League of Legends, Lien Quan Mobile, PUBG Mobile, and Free Fire became defining hits.\",\"Streaming and esports professionalized with big prize pools, clubs, and visible gaming celebrities.\"],\"culture\":\"Gaming became mass audiovisual entertainment. Streamers like Do Mixi, PewPew, and Cris Devil Gamer turned play into a spectator format, while esports became a structured entertainment ecosystem.\",\"acceptance\":\"Government adopted a more open and pragmatic stance by recognizing esports as a competitive sport. Society became more accepting of professional gamers and streamers, though parents still worried about screen time.\",\"source\":\"The Evolution of Gaming in Vietnam research document.\"},\"17\":{\"era_key\":\"digital-economy\",\"era_title\":\"Cross-Platform Games & the Digital Economy Era\",\"years\":\"2021 - Present\",\"summary\":\"5G, cloud technology, and stronger engines pushed Vietnam into a cross-platform and globally visible phase. Amanotes, iKame, and Sky Mavis showed that Vietnamese studios could build for global audiences at scale, while GameVerse and new university majors signaled that the ecosystem itself was becoming more formal and visible.\",\"visual_label\":\"Placeholder collage: GameVerse, Amanotes, iKame, Axie Infinity, cross-platform play, university majors\",\"visual_note\":\"Representative image for GameVerse, the creative-tech narrative, and Vietnam's globalized game ecosystem.\",\"image_url\":\"images/era4.jpeg\",\"image_credit\":\"Image: local file - era4.jpeg\",\"milestones\":[\"Amanotes, iKame, and Sky Mavis became high-visibility proof that Vietnamese studios could scale globally rather than only publish imported games locally.\",\"The 2021-2022 blockchain wave, led by Axie Infinity, briefly put Vietnam at the center of global Web3 gaming discussion.\",\"In 2024, Vietnamese apps and games generated more than 2,000 billion VND from international users on Google Play.\",\"In 2025, Vietnamese-made mobile games reached 4.9 billion global downloads.\"],\"culture\":\"Gaming now blends into the lifestyle of Gen Z and Gen Alpha, but the defining shift is that Vietnam is no longer just consuming games. Public-facing events like GameVerse and globally successful studios make production itself part of gaming culture.\",\"acceptance\":\"Government now frames gaming as a spearhead digital-economy sector, and major urban audiences increasingly view it as a high-tech creative industry rather than a social problem. This is also the first era when export success, education, and public events clearly move in the same direction.\",\"source\":\"The Evolution of Gaming in Vietnam research document; ABEI; Google App Summit 2025; VnExpress GameVerse 2026.\"},\"18\":{\"columns\":[\"Aspect\",\"Console Button<br>1990s\",\"PC & Internet Boom<br>2000 - 2010\",\"Mobile Shift & Esports<br>2011 - 2020\",\"Digital Economy Era<br>2021 - Present\"],\"rows\":[{\"aspect\":\"Gaming Culture\",\"c1\":\"Hyper-local and face-to-face. Play revolved around rented consoles, arcade corners, and neighborhood spectatorship.\",\"c2\":\"Quan Net culture became a mass youth ritual. Guilds, LAN titles, scratch cards, and online communities defined daily play.\",\"c3\":\"Gaming turned personal, mobile, and highly social. Streaming and esports made play both participatory and spectator-friendly.\",\"c4\":\"Gaming blends into digital lifestyle, but production is now part of the culture too through globally visible Vietnamese studios.\"},{\"aspect\":\"Social Acceptance\",\"c1\":\"Mostly seen as a childish distraction. Public debate stayed limited because the market was still small and informal.\",\"c2\":\"This was the peak era of stigma. Curfews, licensing pressure, and media panic framed gaming as addiction and academic risk.\",\"c3\":\"Acceptance improved as smartphones normalized gaming and esports gained recognition, though family concern over screen time remained.\",\"c4\":\"Gaming is increasingly seen as a creative-tech and digital-economy sector, even if concerns about youth behavior still coexist.\"},{\"aspect\":\"VN Game Production\",\"c1\":\"There was no real domestic production base. Hardware and content mainly arrived through informal imports and gray channels.\",\"c2\":\"Vietnam built its first large-scale publishing and operations layer by localizing imported online titles for the domestic market.\",\"c3\":\"Vietnamese studios became more visible through mobile-first development, while local publishers expanded into esports and live operations.\",\"c4\":\"Domestic studios now produce for global audiences at export scale, with names like Amanotes, iKame, and Sky Mavis proving outward reach.\"}],\"source\":\"The Evolution of Gaming in Vietnam research document.\"},\"19\":{\"columns\":[\"Foundational Factor\",\"1990s\\nPost-Doi Moi & Analog\",\"2000s\\nIndustrializing & Broadband\",\"2010s\\nMobile Leapfrog & Startup Boom\",\"2021 - 2026\\nDigital Economy & Global Export\"],\"rows\":[{\"aspect\":\"Economic Condition\",\"c1\":\"- Post-embargo recovery.\\n- Low disposable income.\\n- Survival-oriented economy.\",\"c2\":\"- Rapid GDP growth.\\n- Emerging middle class.\\n- Early industrialization & urbanization.\",\"c3\":\"- Transition to lower-middle-income status.\\n- Massive FDI inflows.\\n- Tech startup ecosystem takes root.\",\"c4\":\"- High-growth digital economy.\\n- Venture capital hub.\\n- Surge in premium/discretionary spending.\"},{\"aspect\":\"State of Technology\",\"c1\":\"- Purely analog.\\n- Fixed landlines are a luxury.\\n- CRT screens & physical media.\",\"c2\":\"- Fixed-line ADSL broadband.\\n- Desktop computing boom.\\n- Basic local server architecture.\",\"c3\":\"- 3G/4G mobile network ubiquity.\\n- Mass smartphone democratization.\\n- Early cloud infrastructure.\",\"c4\":\"- 5G infrastructure & fiber-to-the-home.\\n- Pervasive cloud computing.\\n- Advanced AI & software automation.\"},{\"aspect\":\"Human Resource Capability\",\"c1\":\"- High basic literacy.\\n- Severe lack of software/tech skills.\\n- Focus on mechanical/hardware vocational training.\",\"c2\":\"- First wave of Computer Science graduates.\\n- Emergence of IT System Administrators.\\n- Basic software localization & data entry skills.\",\"c3\":\"- Boom of self-taught mobile developers.\\n- Growth of large-scale IT outsourcing.\\n- Rise of professional digital content creators.\",\"c4\":\"- World-class creative-tech workforce.\\n- High-tier software engineers & UI/UX designers.\\n- Formalized tech university pipelines.\"},{\"aspect\":\"Global Cultural Integration\",\"c1\":\"- Geopolitically isolated.\\n- Delayed trickle of foreign media via border trade.\\n- Absolute English language barriers.\",\"c2\":\"- Regional Asian integration.\\n- Massive cultural influence from China/South Korea pop culture.\",\"c3\":\"- Global Western & Asian cultural blend.\\n- High English proficiency among urban youth.\\n- Heavy social media assimilation.\",\"c4\":\"- Native global citizens (Gen Z/Alpha).\\n- Real-time synchronization with global internet culture.\\n- Transition from cultural consumer to global cultural exporter.\"},{\"aspect\":\"Consumerism & Payment\",\"c1\":\"- Strict cash-only society.\\n- Deeply ingrained saving culture.\\n- Consumerism limited to basic, physical commodities.\",\"c2\":\"- Early spending on intangible leisure.\\n- Prepaid telecom \\\"scratch cards\\\" act as primitive digital currency.\",\"c3\":\"- Shift to digital entertainment spending.\\n- Emergence of e-wallets (MoMo).\\n- Normalization of micro-transactions.\",\"c4\":\"- Ubiquitous cashless economy.\\n- Standardized QR payments (VietQR).\\n- Fully matured digital consumerism focused on instant emotional/experiential value.\"}],\"source\":\"Vietnam_Macro_Transformation_Bedrock.pptx, slide 3.\"},\"20\":{\"yearly_counts\":[{\"year\":2010,\"vietnamese\":4,\"non_vietnamese\":18,\"total\":22},{\"year\":2011,\"vietnamese\":12,\"non_vietnamese\":88,\"total\":10 e, and export domestic game production.\",\"This reflects a broader national push to move from low-cost assembly into higher-value digital content and creative technology.\"],\"right_title\":\"What Decree 147 means in practice\",\"right_points\":[\"Foreign operators can no longer serve Vietnam remotely without local legal presence and compliance infrastructure.\",\"Games are split into G1-G4 tiers with different licensing steps, but all require formal domestic approval.\",\"Platforms must support real-name checks, youth playtime limits, localized data handling, and strict content restrictions.\",\"Full pre-launch compliance can still require roughly 8-15 months and substantial setup cost, raising the entry barrier.\"],\"bottom_kpis\":[{\"value\":\"20 days\",\"label\":\"G1 review window after Decree 147\"},{\"value\":\"184\",\"label\":\"active G1 licenses left by Q1 2026\"},{\"value\":\"$0.5M-$2.0M\",\"label\":\"estimated compliant pre-launch capital\"}],\"source\":\"Vietnamese Game Development Government Support.docx\"},\"27\":{\"direct_support\":[\"Resolutions 79 and 80 position digital cultural products, including games, inside a broader national cultural-industry plan.\",\"The state targets 5,000 specialists for history-focused educational game development and links support to digitizing heritage into interactive products.\",\"GameVerse and the GameHub competition function as state-backed promotional and incubation platforms for local studios.\"],\"indirect_support\":[\"Qualified software producers can access a 10% CIT rate for 15 years, versus the normal 20% rate.\",\"Studios can receive a 4-year full CIT exemption followed by a 50% reduction for the next 9 years.\",\"Additional tools include VAT exemption, 200% R&D deduction, SME startup incentives, and tax-deductible science & technology funds.\"],\"talent_pipeline\":[\"PTIT launched Vietnam's first public Game Design and Development degree in 2024 and expanded into Game Art and Digital Cinema Technology in 2026.\",\"UIT partnered with VNGGames and Roblox to train students through publishable game projects on the Roblox platform.\",\"RMIT, FPT Polytechnic, and SAMA expand the pipeline beyond pure computer science into game design, art, and production practice.\"],\"highlight\":{\"value\":\"50,000\",\"label\":\"GameVerse 2026 visitors\",\"note\":\"up from about 20,000 at its 2023 launch\"},\"source\":\"Vietnamese Game Development Government Support.docx\"},\"28\":{\"evolution\":[{\"phase\":\"Outsourcing & training academies\",\"copy\":\"Glass Egg and Gameloft gave Vietnam its first disciplined pipelines in 3D art, QA, and structured mobile production.\"},{\"phase\":\"Mobile self-publishing breakout\",\"copy\":\"Flappy Bird proved a Vietnamese developer could reach the world directly, then Amanotes, ABI/Onesoft, and Zitga scaled high-volume mobile publishing.\"},{\"phase\":\"Premium PC and global innovation\",\"copy\":\"Sky Mavis, Hoa, Than Trung, God of Weapons, and Tai Uong show that local teams can now build exportable premium and technically sophisticated products.\"}],\"studios\":[\"Glass Egg: AAA art workflows for Call of Duty, Spider-Man, Need for Speed, and Forza.\",\"Amanotes: first Southeast Asian publisher to reach the 3B-download club in 2023.\",\"Sky Mavis: Axie Infinity and Ronin proved global-scale product and infrastructure ambition.\",\"Premium indies: Hoa, Than Trung, God of Weapons, and Tai Uong show credible PC/Steam capability.\"],\"kpis\":[{\"value\":\"27,388\",\"label\":\"new game titles launched in 2025\"},{\"value\":\"8.5B\",\"label\":\"Google Play downloads by local publishers in 2025\"},{\"value\":\"94.47%\",\"label\":\"estimated export share of VN-made downloads\"}],\"source\":\"Vietnam Game Production Ecosystem_ Evolution.docx\"}}");

    function parseCsv(text){let rows=[],lines=[],row=[],cur="",q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c=='"'){if(q&&n=='"'){cur+='"';i++;}else q=!q;}else if(c==","&&!q){row.push(cur);cur="";}else if((c=="\n"||c=="\r")&&!q){if(c=="\r"&&n=="\n")i++;row.push(cur);cur="";lines.push(row);row=[];}else cur+=c;}if(cur.length||row.length){row.push(cur);lines.push(row);}const head=lines[0]||[];for(let i=1;i<lines.length;i++){if(lines[i].every(v=>v===""))continue;let obj={};head.forEach((k,j)=>obj[k]=lines[i][j]??"");rows.push(obj);}return rows;}
    function toCsv(rows){const cell=v=>/[",\n\r]/.test(String(v??""))?'"'+String(v??"").replace(/"/g,'""')+'"':String(v??"");return [FIELDS.join(",")].concat(rows.map(r=>FIELDS.map(f=>cell(r[f]??"")).join(","))).join("\n");}
    function withIds(rows){return rows.map((r,i)=>({...r,_id:r._id||`s-${i+1}-${r.slide_number||i+1}`}));}
    function normalizeLoadedRows(rows){return rows.filter(r=>r&&typeof r==="object"&&!Array.isArray(r));}
    function hasRequiredSlideShape(row){return row&&typeof row.slide_number!=="undefined"&&typeof row.slide_type==="string"&&typeof row.title==="string";}
    function isUsableDeck(rows){return Array.isArray(rows)&&rows.length===EXPECTED_SLIDE_COUNT&&rows.every(hasRequiredSlideShape);}
    function seedRows(){return withIds(parseCsv(SEED));}
    function load(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");if(Array.isArray(saved)&&saved.length){const rows=withIds(normalizeLoadedRows(saved));if(isUsableDeck(rows))return rows;}}catch(e){}const seeded=seedRows();return isUsableDeck(seeded)?seeded:[];}

    function linePath(values,maxY,width,height){return values.map((v,i)=>{const x=(values.length===1)?width/2:(i*(width/(values.length-1)));const y=height-((v/maxY)*height);return `${i===0?'M':'L'}${x.toFixed(1)},${y.toFixed(1)}`;}).join(' ');}

    function linePathRange(values,minY,maxY,width,height){const span=maxY-minY||1;return values.map((v,i)=>{const x=(values.length===1)?width/2:(i*(width/(values.length-1)));const ratio=Math.max(0,Math.min(1,(v-minY)/span));const y=height-(ratio*height);return `${i===0?'M':'L'}${x.toFixed(1)},${y.toFixed(1)}`;}).join(' ');}

    function renderList(){const q=document.getElementById("search").value.trim().toLowerCase(),f=document.getElementById("filter").value;filtered=slides.filter(s=>{const hay=[s.title,s.section,s.subsection,s.part_name,s.notes,s.takeaway].join(" ").toLowerCase();return (!q||hay.includes(q))&&(f==="all"||s.category===f||(f==="meta"&&s.category==="meta"));});if(!filtered.find(s=>s._id===currentId)&&filtered.length)currentId=filtered[0]._id;const list=document.getElementById("list");list.innerHTML=filtered.map(s=>`<div class="item ${s._id===currentId?"active":""}" data-id="${s._id}"><div class="i-top"><span>Slide ${esc(s.slide_number)}</span><span>${esc(s.slide_type)}</span></div><div class="i-title">${esc(s.title||"(Untitled slide)")}</div><div class="i-meta"><span>${esc(s.section||s.part_name||"")}</span><span class="badge ${catCls(s.category)}">${esc(s.category||"meta")}</span></div></div>`).join("");list.querySelectorAll(".item").forEach(el=>el.addEventListener("click",()=>{currentId=el.dataset.id;syncForm();render();}));}
    function renderStage(){const s=current();if(!s)return;document.getElementById("counter").textContent=`Slide ${s.slide_number} of ${slides.length}`;document.getElementById("status").textContent=`Editing slide ${s.slide_number} | ${s.status||"seed"}`;const stage=document.getElementById("slide");if(String(s.slide_number)!=="7")stopPopulationPyramid();if(s.slide_type==="cover"){stage.innerHTML=`<div class="body cover"><div class="mini">Official Deck Skeleton</div><div class="title">${br(s.title)}</div><div class="sub">Vietnam</div></div>`;return;}if(s.slide_type==="divider"){stage.innerHTML=`<div class="body divider"><div class="side">${esc(s.part_name||"Section")}</div><div class="part">Part ${esc(s.part_number||"")}</div><h1>${br(s.title)}</h1></div>`;return;}if(String(s.slide_number)==="4"){renderIncomeSlide(s);return;}if(String(s.slide_number)==="5"){renderEntertainmentDemandSlide(s);return;}if(String(s.slide_number)==="6"){renderDemographicsSlide(s);return;}if(String(s.slide_number)==="7"){renderPopulationPyramidSlide(s);return;}if(String(s.slide_number)==="8"){renderUnder25TrendSlide(s);return;}if(String(s.slide_number)==="9"){renderHardwareSlide(s);return;}if(Number(s.slide_number)>=10&&Number(s.slide_number)<=13){renderHistoryEraSlide(s);return;}if(String(s.slide_number)==="14"){renderHistorySummarySlide(s);return;}if(String(s.slide_number)==="15"){renderMacroBedrockSlide(s);return;}if(String(s.slide_number)==="16"){renderVietnamMoviesSlide(s);return;}if(String(s.slide_number)==="17"){renderVietnamMoviesRevenueTableCenteredSlide(s);return;}if(String(s.slide_number)==="18"){renderVietnamConcertsSlide(s);return;}if(String(s.slide_number)==="19"){renderVietnamTicketboxSlide(s);return;}if(String(s.slide_number)==="20"){renderTicketboxWtpSlide(s,"foreign");return;}if(String(s.slide_number)==="21"){renderTicketboxWtpSlide(s,"vietnam");return;}if(String(s.slide_number)==="22"){renderYoutubeVideosSlide(s);return;}if(String(s.slide_number)==="23"){renderDemandConclusionSlide(s);return;}if(String(s.slide_number)==="24"){renderPreferenceConclusionSlide(s);return;}if(String(s.slide_number)==="25"){renderSupplyPolicySlide(s);return;}if(String(s.slide_number)==="26"){renderSupplySupportSlide(s);return;}if(String(s.slide_number)==="27"){renderSupplyCapabilitySlide(s);return;}stage.innerHTML=`<div class="body"><div class="eyebrow"><div class="path">${esc(s.part_name||"")}${s.section?" > "+esc(s.section):""}</div><div class="badge ${catCls(s.category)}">${esc(s.category||s.slide_type)}</div></div><div class="s-title">${br(s.title)}</div><div class="grid"><div class="stack"><div class="card soft"><div class="label">Objective / storyline</div><div class="copy">${br(s.purpose)}</div></div><div class="card"><div class="label">Evidence to insert</div><div class="copy">${br(s.evidence)}</div></div></div><div class="stack"><div class="card"><div class="label">Suggested visual</div><div class="copy">${br(s.visual)}</div></div><div class="card accent"><div class="label">Draft takeaway</div><div class="copy">${br(s.takeaway)}</div><div class="note">Status: ${esc(s.status||"seed")}${s.owner?" | Owner: "+esc(s.owner):""}</div></div></div></div></div>`;}
    function syncForm(){const s=current(),form=document.getElementById("form");if(!s)return;FIELDS.forEach(f=>{const el=form.elements.namedItem(f);if(el)el.value=s[f]??"";});}
    function updateFromForm(){const s=current(),form=document.getElementById("form");if(!s)return;FIELDS.forEach(f=>{const el=form.elements.namedItem(f);if(el)s[f]=el.value;});slides.sort((a,b)=>Number(a.slide_number)-Number(b.slide_number));save();render(false);}
    function render(sync=true){renderList();renderStage();fitSlide();if(sync)syncForm();}
    function exportCsv(){const rows=slides.map(s=>{const o={};FIELDS.forEach(f=>o[f]=s[f]??"");return o;});const blob=new Blob([toCsv(rows)],{type:"text/csv;charset=utf-8;"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="vn_gaming_deck_working.csv";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);}
    function getOrderedSlides(){return [...slides].sort((a,b)=>Number(a.slide_number)-Number(b.slide_number));}
    function parsePageSelection(input){if(!input)return[];const maxSlide=slides.length,seen=new Set(),out=[];for(const raw of input.split(",")){const part=raw.trim();if(!part)continue;const range=part.match(/^(\\d+)\\s*-\\s*(\\d+)$/);if(range){let start=Number(range[1]),end=Number(range[2]);if(!Number.isFinite(start)||!Number.isFinite(end))return null;if(start>end){const tmp=start;start=end;end=tmp;}for(let n=start;n<=end;n++){if(n<1||n>maxSlide)return null;if(!seen.has(n)){seen.add(n);out.push(n);}}continue;}const single=Number(part);if(!Number.isInteger(single)||single<1||single>maxSlide)return null;if(!seen.has(single)){seen.add(single);out.push(single);}}return out.sort((a,b)=>a-b);}
    function collectPrintableSlides(selected){const originalId=currentId,stage=document.getElementById("slide"),pages=[];stopPopulationPyramid();for(const s of selected){currentId=s._id;renderStage();pages.push({slide_number:s.slide_number,title:s.title,markup:stage.innerHTML});}currentId=originalId;render(false);return pages;}
    function openPdfExport(selected){if(!selected.length)return;const pages=collectPrintableSlides(selected);const baseStyle=(document.querySelector("style")||{textContent:""}).textContent;const printStyle=`${baseStyle}\nhtml,body{margin:0;padding:0;background:#fff;font-family:Roboto,sans-serif;color:#171717;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important} *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important;box-sizing:border-box} body{padding:0} .print-deck{display:block} .print-slide{position:relative;inset:auto;width:1280px;height:720px;margin:0;background:#fff!important;color:#171717;box-shadow:none;overflow:hidden;transform:none!important;break-after:page;page-break-after:always} .print-slide:last-child{break-after:auto;page-break-after:auto} .print-slide:after{content:\"\";position:absolute;left:0;right:0;bottom:0;height:12px;background:#ed1c24!important} .bar,.bar.highlight,.bench-fill,.bench-fill.highlight,.legend-swatch,.demo-seg,.pyramid-bar,.hardware-fill,.u25-hit,.sw-line,.sw-bar,.pyramid-center,.history-era-tab.active,.history-era-chip{forced-color-adjust:none!important} svg,svg *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important} @page{size:1280px 720px;margin:0;}`;const win=window.open("","_blank");if(!win){window.alert("Please allow pop-ups so the PDF export window can open.");return;}const cards=pages.map(page=>`<div class="print-slide">${page.markup}</div>`).join("");win.document.open();win.document.write(`<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>VN Gaming Deck PDF Export</title><style>${printStyle}</style></head><body><div class="print-deck">${cards}</div></body></html>`);win.document.close();win.focus();win.setTimeout(()=>win.print(),250);}
    function exportAllPdf(){openPdfExport(getOrderedSlides());}
    function exportPagesPdf(){const answer=window.prompt("Enter slide numbers or ranges to export as PDF. Example: 8,11-13","");if(answer===null)return;const pages=parsePageSelection(answer);if(!pages||!pages.length){window.alert("Please enter valid slide numbers or ranges, such as 8 or 8,11-13.");return;}const selected=getOrderedSlides().filter(s=>pages.includes(Number(s.slide_number)));openPdfExport(selected);}
    function importCsv(text){const rows=withIds(parseCsv(text));if(!rows.length)return;slides=rows;currentId=slides[0]._id;save();render();}
    function boot(){slides=load();currentId=slides[0] ? slides[0]._id : null;buildForm();try{render();}catch(err){console.error("Workbench boot failed, restoring seed",err);localStorage.removeItem(STORAGE_KEY);slides=seedRows();currentId=slides[0] ? slides[0]._id : null;render();}}
    boot();
    document.getElementById("search").addEventListener("input",()=>render(false));document.getElementById("filter").addEventListener("change",()=>render(false));
    document.getElementById("prev").addEventListener("click",()=>{const i=filtered.findIndex(s=>s._id===currentId);if(i>0){currentId=filtered[i-1]._id;render();}});
    document.getElementById("next").addEventListener("click",()=>{const i=filtered.findIndex(s=>s._id===currentId);if(i>=0&&i<filtered.length-1){currentId=filtered[i+1]._id;render();}});
    document.getElementById("export").addEventListener("click",exportCsv);document.getElementById("pdfAll").addEventListener("click",exportAllPdf);document.getElementById("pdfPages").addEventListener("click",exportPagesPdf);document.getElementById("fullscreen").addEventListener("click",toggleFullscreen);document.getElementById("reset").addEventListener("click",()=>{localStorage.removeItem(STORAGE_KEY);slides=withIds(parseCsv(SEED));currentId=slides[0]._id;save();render();});
    document.getElementById("import").addEventListener("click",()=>document.getElementById("file").click());document.getElementById("file").addEventListener("change",async e=>{const file=e.target.files[0];if(!file)return;importCsv(await file.text());e.target.value="";});
    document.addEventListener("keydown",e=>{if(e.target.closest("textarea,input,select"))return;if(e.key==="ArrowRight")document.getElementById("next").click();if(e.key==="ArrowLeft")document.getElementById("prev").click();});
    document.addEventListener("fullscreenchange",()=>{updateFullscreenButton();fitSlide();});
    window.addEventListener("resize",fitSlide);
  </script>
