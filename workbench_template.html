    function renderVietnamTicketboxSlide(s) {{
      const d = specialData[25];
      const stage = document.getElementById("slide");
      const chartW = 660;
      const chartH = 250;
      const maxValue = Math.max(...d.yearly_counts.flatMap(x => [x.vietnam, x.foreign]));
      const ticks = [0, Math.ceil(maxValue * .25), Math.ceil(maxValue * .5), Math.ceil(maxValue * .75), maxValue];
      const shareSeries = d.yearly_counts.map(item => item.vietnam / (item.vietnam + item.foreign) * 100);
      const sharePath = linePathRange(shareSeries, 0, 100, chartW, chartH);
      const sharePoints = shareSeries.map((v, i) => {
        const year = d.yearly_counts[i].year;
        const x = (shareSeries.length === 1) ? (chartW / 2) : (i * (chartW / (shareSeries.length - 1)));
        const y = chartH - ((v / 100) * chartH);
        return `<circle class="ticketbox-share-dot" data-year="${year}" data-share="${v.toFixed(1)}%" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.2"><title>${year} Vietnamese share: ${v.toFixed(1)}%</title></circle><text class="ticketbox-share-label" x="${x.toFixed(1)}" y="${(y - 9).toFixed(1)}" text-anchor="middle">${v.toFixed(1)}%</text>`;
      }).join("");
      const bars = d.yearly_counts.map(item => {
        const yearTotal = item.vietnam + item.foreign;
        const yearShare = yearTotal ? (item.vietnam / yearTotal) * 100 : 0;
        return `<div class="ticketbox-col"><div class="ticketbox-bar-pair"><div class="ticketbox-bar vn" data-year="${item.year}" data-label="Vietnam" data-value="${item.vietnam}" data-year-total="${yearTotal}" data-year-share="${yearShare.toFixed(1)}" data-total-vn="${d.totalVietnam}" data-total-foreign="${d.totalForeign}" style="height:${Math.max(item.vietnam ? 8 : 0, (item.vietnam / maxValue) * 100)}%"><title>${item.year} Vietnam: ${item.vietnam} sold-out ticket tiers</title></div><div class="ticketbox-bar foreign" data-year="${item.year}" data-label="Foreign" data-value="${item.foreign}" data-year-total="${yearTotal}" data-year-share="${yearShare.toFixed(1)}" data-total-vn="${d.totalVietnam}" data-total-foreign="${d.totalForeign}" style="height:${Math.max(item.foreign ? 8 : 0, (item.foreign / maxValue) * 100)}%"><title>${item.year} Foreign: ${item.foreign} sold-out ticket tiers</title></div></div></div>`;
      }).join("");
      const labels = d.yearly_counts.map(item => `<div class="ticketbox-year">${item.year}</div>`).join("");
      const rightAxis = [100, 90, 80, 70, 60, 50, 40].map(v => `<span>${v}%</span>`).join("");

      stage.innerHTML = `<div class="body"><div class="eyebrow"><div class="path">${esc(s.part_name || "")}${s.section ? " > " + esc(s.section) : ""}</div><div class="badge demand">demand</div></div><div class="s-title">${br(s.title)}</div><div class="takeaway-banner"><strong>Take away:</strong> ${esc(s.takeaway)}</div><div class="ticketbox-grid"><div class="ticketbox-panel"><div class="ticketbox-chart-head"><div><div class="income-title">Sold-out ticket tiers by event origin</div><div class="ticketbox-sub">Bars show sold-out ticket tiers. The black line shows Vietnamese sold-out tier share within the total sold-out tier count.</div></div><div class="ticketbox-kpis"><div class="concerts-kpi"><div class="concerts-kpi-num">${fmtInt(d.peakVietnam)}</div><div class="concerts-kpi-lbl">2025 VN sold-out tiers</div></div><div class="concerts-kpi"><div class="concerts-kpi-num">${fmtInt(d.peakForeign)}</div><div class="concerts-kpi-lbl">2025 foreign sold-out tiers</div></div></div></div><div class="ticketbox-legend"><div class="legend-item"><span class="legend-swatch sw-ticketbox-vn"></span>Vietnam events</div><div class="legend-item"><span class="legend-swatch sw-ticketbox-foreign"></span>Foreign events</div><div class="legend-item"><span class="legend-swatch sw-ticketbox-share"></span>VN share of sold-out tiers</div></div><div class="ticketbox-chart-wrap"><div class="ticketbox-left-axis">${ticks.slice().reverse().map(t => `<span>${fmtInt(t)}</span>`).join("")}</div><div class="ticketbox-area" id="ticketboxArea"><div class="ticketbox-gridline" style="top:0%"></div><div class="ticketbox-gridline" style="top:25%"></div><div class="ticketbox-gridline" style="top:50%"></div><div class="ticketbox-gridline" style="top:75%"></div><div class="ticketbox-gridline" style="top:100%"></div><svg class="ticketbox-share-svg" viewBox="0 0 ${chartW} ${chartH}" preserveAspectRatio="none"><path class="ticketbox-share-line" d="${sharePath}"></path>${sharePoints}</svg><div class="ticketbox-groups">${bars}</div><div class="ticketbox-years">${labels}</div><div class="ticketbox-tooltip" id="ticketboxTooltip"></div></div><div class="ticketbox-right-axis">${rightAxis}</div></div><div class="ticketbox-note"><strong>Read-through:</strong> ${esc(d.readthrough)}</div></div><div class="ticketbox-panel"><div class="history-summary-head"><div class="income-title">What the chart implies</div><div class="ticketbox-sub">This is not event count. It is sold-out product count, so it better captures how deeply organizers convert demand into sold-through ticket tiers.</div></div><div class="ticketbox-kpis"><div class="kpi"><div class="kpi-num">${fmtInt(d.totalVietnam)}</div><div class="kpi-lbl">VN sold-out tiers, 2023-2025</div></div><div class="kpi"><div class="kpi-num">${fmtInt(d.totalForeign)}</div><div class="kpi-lbl">Foreign sold-out tiers, 2023-2025</div></div></div><div class="card soft"><div class="label">Interpretation</div><div class="copy">Vietnamese events account for more sold-out ticket-tier products in every year shown, which suggests stronger local demand depth and more experimentation in pricing and package design than foreign entertainment supply on the same platform.</div></div><div class="card"><div class="label">Method note</div><div class="copy">${esc(d.note)}</div></div><div class="ticketbox-source"><strong>Source:</strong> ${esc(d.source)}</div></div></div></div>`;

      const area = stage.querySelector('#ticketboxArea');
      const tooltip = stage.querySelector('#ticketboxTooltip');
      stage.querySelectorAll('.ticketbox-bar,.ticketbox-share-dot').forEach(bar => {
        bar.addEventListener('mouseenter', () => tooltip.style.display = 'block');

        bar.addEventListener('mousemove', e => {

          const x = e.clientX - rect.left + 12;
          const y = e.clientY - rect.top - 12;
          const isShare = bar.classList.contains('ticketbox-share-dot');
          tooltip.innerHTML = isShare
            ? `<strong>${bar.dataset.year}</strong>Vietnamese share: ${bar.dataset.share}`
            : `<strong>${bar.dataset.year} | ${bar.dataset.label}</strong>${fmtInt(bar.dataset.value)} sold-out ticket tiers<br>VN share that year: ${bar.dataset.yearShare}%<br>Year total sold-out tiers: ${fmtInt(bar.dataset.yearTotal)}<br>3-year VN total: ${fmtInt(bar.dataset.totalVn)}<br>3-year foreign total: ${fmtInt(bar.dataset.totalForeign)}`;
          tooltip.style.left = `${Math.min(Math.max(8, x), rect.width - 210)}px`;
          tooltip.style.top = `${Math.max(8, y - 52)}px`;
        });
      });
    }

    function buildForm(){{const form=document.getElementById("form");form.innerHTML=formFields.map(([name,type])=>{{const label=name.replaceAll("_"," ");if(type==="textarea")return `<div class="field"><label for="${{name}}">${{label}}</label><textarea id="${{name}}" name="${{name}}"></textarea></div>`;if(type==="select")return `<div class="field"><label for="${{name}}">${{label}}</label><select id="${{name}}" name="${{name}}">${{opts[name].map(v=>`<option value="${{v}}">${{v}}</option>`).join("")}}</select></div>`;return `<div class="field"><label for="${{name}}">${{label}}</label><input id="${{name}}" name="${{name}}" type="${{type}}"></div>`;}}).join("");form.insertAdjacentHTML("beforeend",'<div class="help">Tip: edit the CSV in Excel if you prefer table work, then re-import it here.</div>');form.addEventListener("input",updateFromForm);}}
    function renderList(){{const q=document.getElementById("search").value.trim().toLowerCase(),f=document.getElementById("filter").value;filtered=slides.filter(s=>{{const hay=[s.title,s.section,s.subsection,s.part_name,s.notes,s.takeaway].join(" ").toLowerCase();return (!q||hay.includes(q))&&(f==="all"||s.category===f||(f==="meta"&&s.category==="meta"));}});if(!filtered.find(s=>s._id===currentId)&&filtered.length)currentId=filtered[0]._id;const list=document.getElementById("list");list.innerHTML=filtered.map(s=>`<div class="item ${{s._id===currentId?"active":""}}" data-id="${{s._id}}"><div class="i-top"><span>Slide ${{esc(s.slide_number)}}</span><span>${{esc(s.slide_type)}}</span></div><div class="i-title">${{esc(s.title||"(Untitled slide)")}}</div><div class="i-meta"><span>${{esc(s.section||s.part_name||"")}}</span><span class="badge ${{catCls(s.category)}}">${{esc(s.category||"meta")}}</span></div></div>`).join("");list.querySelectorAll(".item").forEach(el=>el.addEventListener("click",()=>{{currentId=el.dataset.id;syncForm();render();}}));}}
    function renderStage(){{const s=current();if(!s)return;document.getElementById("counter").textContent=`Slide ${{s.slide_number}} of ${{slides.length}}`;document.getElementById("status").textContent=`Editing slide ${{s.slide_number}} | ${{s.status||"seed"}}`;const stage=document.getElementById("slide");if(String(s.slide_number)!=="7")stopPopulationPyramid();if(s.slide_type==="cover"){{stage.innerHTML=`<div class="body cover"><div class="mini">Official Deck Skeleton</div><div class="title">${{br(s.title)}}</div><div class="sub">Vietnam</div></div>`;return;}}if(s.slide_type==="divider"){{stage.innerHTML=`<div class="body divider"><div class="side">${{esc(s.part_name||"Section")}}</div><div class="part">Part ${{esc(s.part_number||"")}}</div><h1>${{br(s.title)}}</h1></div>`;return;}}if(String(s.slide_number)==="4"){{renderIncomeSlide(s);return;}}if(String(s.slide_number)==="5"){{renderEntertainmentDemandSlide(s);return;}}if(String(s.slide_number)==="6"){{renderDemographicsSlide(s);return;}}if(String(s.slide_number)==="7"){{renderPopulationPyramidSlide(s);return;}}if(String(s.slide_number)==="8"){{renderUnder25TrendSlide(s);return;}}if(String(s.slide_number)==="9"){{renderHardwareSlide(s);return;}}if(Number(s.slide_number)>=10&&Number(s.slide_number)<=13){{renderHistoryEraSlide(s);return;}}if(String(s.slide_number)==="14"){{renderHistorySummarySlide(s);return;}}if(String(s.slide_number)==="15"){{renderMacroBedrockSlide(s);return;}}if(String(s.slide_number)==="16"){{renderVietnamMoviesSlide(s);return;}}if(String(s.slide_number)==="17"){{renderVietnamMoviesRevenueTableCenteredSlide(s);return;}}if(String(s.slide_number)==="18"){{renderVietnamConcertsSlide(s);return;}}if(String(s.slide_number)==="19"){{renderVietnamTicketboxSlide(s);return;}}if(String(s.slide_number)==="20"){{renderTicketboxWtpSlide(s,"foreign");return;}}if(String(s.slide_number)==="21"){{renderTicketboxWtpSlide(s,"vietnam");return;}}if(String(s.slide_number)==="22"){{renderYoutubeVideosSlide(s);return;}}if(String(s.slide_number)==="23"){{renderDemandConclusionSlide(s);return;}}if(String(s.slide_number)==="24"){{renderPreferenceConclusionSlide(s);return;}}if(String(s.slide_number)==="25"){{renderDonorPolicyIntroSlide(s);return;}}if(Number(s.slide_number)>=26&&Number(s.slide_number)<=28){{renderDonorPolicyEraDetailSlide(s);return;}}if(String(s.slide_number)==="29"){{renderDonorSupplySupportSlide(s);return;}}if(String(s.slide_number)==="30"){{renderDonorSupplyCapabilitySlide(s);return;}}if(String(s.slide_number)==="31"){{renderDonorStudioProofSlide(s);return;}}stage.innerHTML=`<div class="body"><div class="eyebrow"><div class="path">${{esc(s.part_name||"")}}${{s.section?" > "+esc(s.section):""}}</div><div class="badge ${{catCls(s.category)}}">${{esc(s.category||s.slide_type)}}</div></div><div class="s-title">${{br(s.title)}}</div><div class="grid"><div class="stack"><div class="card soft"><div class="label">Objective / storyline</div><div class="copy">${{br(s.purpose)}}</div></div><div class="card"><div class="label">Evidence to insert</div><div class="copy">${{br(s.evidence)}}</div></div></div><div class="stack"><div class="card"><div class="label">Suggested visual</div><div class="copy">${{br(s.visual)}}</div></div><div class="card accent"><div class="label">Draft takeaway</div><div class="copy">${{br(s.takeaway)}}</div><div class="note">Status: ${{esc(s.status||"seed")}}${{s.owner?" | Owner: "+esc(s.owner):""}}</div></div></div></div></div>`;}}
    function syncForm(){{const s=current(),form=document.getElementById("form");if(!s)return;FIELDS.forEach(f=>{{const el=form.elements.namedItem(f);if(el)el.value=s[f]??"";}});}}
    function updateFromForm(){{const s=current(),form=document.getElementById("form");if(!s)return;FIELDS.forEach(f=>{{const el=form.elements.namedItem(f);if(el)s[f]=el.value;}});slides.sort((a,b)=>Number(a.slide_number)-Number(b.slide_number));save();render(false);}}
    function render(sync=true){{renderList();renderStage();fitSlide();if(sync)syncForm();}}
    function exportCsv(){{const rows=slides.map(s=>{{const o={{}};FIELDS.forEach(f=>o[f]=s[f]??"");return o;}});const blob=new Blob([toCsv(rows)],{{type:"text/csv;charset=utf-8;"}}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="vn_gaming_deck_working.csv";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);}}
    function getOrderedSlides(){{return [...slides].sort((a,b)=>Number(a.slide_number)-Number(b.slide_number));}}
    function parsePageSelection(input){{if(!input)return[];const maxSlide=slides.length,seen=new Set(),out=[];for(const raw of input.split(",")){{const part=raw.trim();if(!part)continue;const range=part.match(/^(\\d+)\\s*-\\s*(\\d+)$/);if(range){{let start=Number(range[1]),end=Number(range[2]);if(!Number.isFinite(start)||!Number.isFinite(end))return null;if(start>end){{const tmp=start;start=end;end=tmp;}}for(let n=start;n<=end;n++){{if(n<1||n>maxSlide)return null;if(!seen.has(n)){{seen.add(n);out.push(n);}}}}continue;}}const single=Number(part);if(!Number.isInteger(single)||single<1||single>maxSlide)return null;if(!seen.has(single)){{seen.add(single);out.push(single);}}}}return out.sort((a,b)=>a-b);}}
    function collectPrintableSlides(selected){{const originalId=currentId,stage=document.getElementById("slide"),pages=[];stopPopulationPyramid();for(const s of selected){{currentId=s._id;renderStage();pages.push({{slide_number:s.slide_number,title:s.title,markup:stage.innerHTML}});}}currentId=originalId;render(false);return pages;}}
    function openPdfExport(selected){{if(!selected.length)return;const pages=collectPrintableSlides(selected);const baseStyle=(document.querySelector("style")||{{textContent:""}}).textContent;const printStyle=`${{baseStyle}}\nhtml,body{margin:0;padding:0;background:#fff;font-family:Roboto,sans-serif;color:#171717;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important} *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important;box-sizing:border-box} body{padding:0} .print-deck{display:block} .print-slide{position:relative;inset:auto;width:1280px;height:720px;margin:0;background:#fff!important;color:#171717;box-shadow:none;overflow:hidden;transform:none!important;break-after:page;page-break-after:always} .print-slide:last-child{break-after:auto;page-break-after:auto} .print-slide:after{content:\"\";position:absolute;left:0;right:0;bottom:0;height:12px;background:#ed1c24!important} .bar,.bar.highlight,.bench-fill,.bench-fill.highlight,.legend-swatch,.demo-seg,.pyramid-bar,.hardware-fill,.u25-hit,.sw-line,.sw-bar,.pyramid-center,.history-era-tab.active,.history-era-chip{forced-color-adjust:none!important} svg,svg *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important} @page{size:1280px 720px;margin:0;}`;const win=window.open("","_blank");if(!win){{window.alert("Please allow pop-ups so the PDF export window can open.");return;}}const cards=pages.map(page=>`<div class="print-slide">${{page.markup}}</div>`).join("");win.document.open();win.document.write(`<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>VN Gaming Deck PDF Export</title><style>${{printStyle}}</style></head><body><div class="print-deck">${{cards}}</div></body></html>`);win.document.close();win.focus();win.setTimeout(()=>win.print(),250);}}
    function exportAllPdf(){{openPdfExport(getOrderedSlides());}}
    function exportPagesPdf(){{const answer=window.prompt("Enter slide numbers or ranges to export as PDF. Example: 8,11-13","");if(answer===null)return;const pages=parsePageSelection(answer);if(!pages||!pages.length){{window.alert("Please enter valid slide numbers or ranges, such as 8 or 8,11-13.");return;}}const selected=getOrderedSlides().filter(s=>pages.includes(Number(s.slide_number)));openPdfExport(selected);}}
    function importCsv(text){{const rows=withIds(parseCsv(text));if(!rows.length)return;slides=rows;currentId=slides[0]._id;save();render();}}
    function boot(){{slides=load();currentId=slides[0] ? slides[0]._id : null;buildForm();try{{render();}}catch(err){{console.error("Workbench boot failed, restoring seed",err);localStorage.removeItem(STORAGE_KEY);slides=seedRows();currentId=slides[0] ? slides[0]._id : null;render();}}}}
    boot();
    document.getElementById("search").addEventListener("input",()=>render(false));document.getElementById("filter").addEventListener("change",()=>render(false));
    document.getElementById("prev").addEventListener("click",()=>{{const i=filtered.findIndex(s=>s._id===currentId);if(i>0){{currentId=filtered[i-1]._id;render();}}}});
    document.getElementById("next").addEventListener("click",()=>{{const i=filtered.findIndex(s=>s._id===currentId);if(i>=0&&i<filtered.length-1){{currentId=filtered[i+1]._id;render();}}}});
    document.getElementById("export").addEventListener("click",exportCsv);document.getElementById("pdfAll").addEventListener("click",exportAllPdf);document.getElementById("pdfPages").addEventListener("click",exportPagesPdf);document.getElementById("fullscreen").addEventListener("click",toggleFullscreen);document.getElementById("reset").addEventListener("click",()=>{{localStorage.removeItem(STORAGE_KEY);slides=withIds(parseCsv(SEED));currentId=slides[0]._id;save();render();}});
    document.getElementById("import").addEventListener("click",()=>document.getElementById("file").click());document.getElementById("file").addEventListener("change",async e=>{{const file=e.target.files[0];if(!file)return;importCsv(await file.text());e.target.value="";}});
    document.addEventListener("keydown",e=>{{if(e.target.closest("textarea,input,select"))return;if(e.key==="ArrowRight")document.getElementById("next").click();if(e.key==="ArrowLeft")document.getElementById("prev").click();}});
    document.addEventListener("fullscreenchange",()=>{{updateFullscreenButton();fitSlide();}});
    window.addEventListener("resize",fitSlide);
  </script>
</body>
